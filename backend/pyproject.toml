[project]
name = "dadi"
version = "0.1.0"
description = "Dadi vs Scammers: multilingual AI scam-baiter on Gnani's voice stack"
requires-python = ">=3.12,<3.13"
dependencies = ["voice-core"]

[tool.uv.sources]
voice-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dadi"]
