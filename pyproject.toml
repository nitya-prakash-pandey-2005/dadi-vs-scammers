[project]
name = "dadi-vs-scammers"
version = "0.1.0"
description = "AI grandmother that answers scam calls, wastes fraudsters' time and extracts mule accounts. Built on Gnani AI Prisma, Timbre and voice cloning; Evon v3.3-ready through an OpenAI-compatible adapter (the demos run on Groq)."
requires-python = ">=3.12,<3.13"
dependencies = ["voice-core", "dadi"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "gnani-vachana>=0.9.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["voice-core", "backend"]

[tool.uv.sources]
voice-core = { workspace = true }
dadi = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["voice-core/tests", "backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "docs", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",   # long lines: prompts and multilingual phrase tables read better unwrapped
  "E701",   # one-line `if x: return` guards are used deliberately in hot paths
  "E702",
  "E731",   # small lambdas assigned to names in tests
  "B008",   # FastAPI Depends()/Query() in argument defaults is the framework idiom
  "B905",   # zip() without strict= is intentional where lengths are known
]

[tool.ruff.lint.isort]
known-first-party = ["voice_core", "dadi"]
