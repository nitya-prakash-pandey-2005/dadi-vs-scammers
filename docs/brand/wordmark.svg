<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 200" role="img" aria-labelledby="wt">
  <title id="wt">Dadi vs Scammers</title>
  <defs>
    <linearGradient id="dadi-wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <svg x="10" y="10" width="180" height="180" viewBox="0 0 512 512">
  
  <!-- Dadi: hair bun + round glasses + a phone-handset smile, on a dark tile. -->
  <defs>
    <linearGradient id="dadi-g" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ff5aa5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <mask id="dadi-bun-gap"><rect width="512" height="512" fill="#fff"/><circle cx="256" cy="286" r="176" fill="#000"/></mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="#05060f"/>
  <!-- bun -->
  <circle cx="256" cy="104" r="60" fill="#e353b6" style="fill:url(#dadi-g)" mask="url(#dadi-bun-gap)"/>
  <!-- head -->
  <circle cx="256" cy="286" r="160" fill="#c454d0" style="fill:url(#dadi-g)"/>
  <!-- glasses: light lenses, dark frames, bridge -->
  <g stroke="#05060f" stroke-width="18" stroke-linecap="round">
    <circle cx="190" cy="262" r="48" fill="#fff4fa"/>
    <circle cx="322" cy="262" r="48" fill="#fff4fa"/>
    <path d="M238 258 Q256 244 274 258" fill="none"/>
    <path d="M142 254 L112 242" fill="none"/>
    <path d="M370 254 L400 242" fill="none"/>
  </g>
  <!-- cheeks -->
  <circle cx="146" cy="318" r="20" fill="#ff8cc6" opacity=".55"/>
  <circle cx="366" cy="318" r="20" fill="#ff8cc6" opacity=".55"/>
  <!-- eyes -->
  <circle cx="198" cy="268" r="15" fill="#05060f"/>
  <circle cx="314" cy="268" r="15" fill="#05060f"/>
  <!-- phone-handset smile -->
  <g fill="#05060f">
    <path d="M200 350 Q256 402 312 350" fill="none" stroke="#05060f" stroke-width="20" stroke-linecap="round"/>
    <rect x="160" y="321" width="66" height="40" rx="17" transform="rotate(-48 193 341)"/>
    <rect x="286" y="321" width="66" height="40" rx="17" transform="rotate(48 319 341)"/>
  </g>

</svg>
  <text x="222" y="128" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2.5">
    <tspan fill="#ff4d9d" style="fill:url(#dadi-wg)">Dadi</tspan><tspan fill="#8b8aa3" font-size="64" font-weight="500" dx="18">vs</tspan><tspan fill="#8b5cf6" dx="18">Scammers</tspan>
  </text>
</svg>
